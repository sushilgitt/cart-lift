query CartInput($collectionIds: [ID!]) {
  presentmentCurrencyRate
  # The buyer's country: deals limited to markets run only in their countries.
  localization {
    country {
      isoCode
    }
  }
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      deal: attribute(key: "_cartlift") {
        value
      }
      arm: attribute(key: "_cartlift_arm") {
        value
      }
      bar: attribute(key: "_cartlift_bar") {
        value
      }
      gift: attribute(key: "_cartlift_gift") {
        value
      }
      upsell: attribute(key: "_cartlift_upsell") {
        value
      }
      bundle: attribute(key: "_cartlift_bundle") {
        value
      }
      # A subscription line: the deal decides whether it counts (FnDeal.sub).
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
            # Search & Discovery's complementary products, for complementary upsells.
            complementary: metafield(namespace: "shopify--discovery--product_recommendation", key: "complementary_products") {
              value
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:cartlift", key: "config") {
      jsonValue
    }
  }
}
